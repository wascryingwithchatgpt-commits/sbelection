<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Live Hypixel SkyBlock mayor, minister, candidates, votes, and perks.">
  <title>SkyBlock Election Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1524'/%3E%3Cpath d='M16 27h32v24H16z' fill='%2319263b' stroke='%2364e6b7' stroke-width='4'/%3E%3Cpath d='m23 27 9-14 9 14' fill='none' stroke='%23f4c95d' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M24 38h16M24 45h10' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">HYPIXEL SKYBLOCK</p>
      <h1>Election Tracker</h1>
    </div>
    <button id="refreshButton" type="button">Refresh data</button>
  </header>

  <main>
    <section id="status" class="status" aria-live="polite">
      <span class="status-dot"></span>
      <span id="statusText">Loading the latest election…</span>
    </section>

    <section id="leadership" class="leadership" aria-label="Current leadership"></section>

    <section class="election-heading">
      <div>
        <p class="eyebrow">ONGOING ELECTION</p>
        <h2 id="electionTitle">Candidates</h2>
      </div>
      <div class="vote-summary">
        <strong id="totalVotes">—</strong>
        <span>total votes</span>
      </div>
    </section>

    <section id="candidateGrid" class="candidate-grid" aria-live="polite"></section>
  </main>

  <template id="leadershipTemplate">
    <article class="leader-card mayor-card">
      <div class="card-label">Current mayor</div>
      <h2 class="leader-name"></h2>
      <div class="perk-list"></div>
    </article>
  </template>

  <template id="candidateTemplate">
    <article class="candidate-card">
      <div class="candidate-topline">
        <div>
          <span class="rank"></span>
          <h3 class="candidate-name"></h3>
        </div>
        <div class="candidate-votes"></div>
      </div>
      <div class="vote-bar" aria-hidden="true"><span></span></div>
      <div class="candidate-perks"></div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
