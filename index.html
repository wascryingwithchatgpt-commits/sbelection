<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta
    name="description"
    content="Live Hypixel SkyBlock election and saved mayor perk tracker."
  >
  <title>SkyBlock Election Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">HYPIXEL SKYBLOCK</p>
      <h1>Election Tracker</h1>
    </div>

    <button id="refreshButton" type="button">
      Refresh data
    </button>
  </header>

  <main>
    <section
      id="status"
      class="status"
      aria-live="polite"
    >
      <span class="status-dot"></span>
      <span id="statusText">
        Loading the latest data…
      </span>
    </section>

    <nav class="view-menu" aria-label="Tracker views">
      <button
        id="selectedTab"
        class="view-tab active"
        type="button"
        aria-selected="true"
      >
        Selected
      </button>

      <button
        id="mayorDataTab"
        class="view-tab"
        type="button"
        aria-selected="false"
      >
        Mayor Data
      </button>
    </nav>

    <section id="selectedView" class="tracker-view">
      <section
        id="leadership"
        class="leadership"
        aria-label="Current leadership"
      ></section>

      <section class="election-heading">
        <div>
          <p
            id="sectionEyebrow"
            class="eyebrow"
          >
            ELECTION STATUS
          </p>

          <h2 id="electionTitle">
            Loading election
          </h2>
        </div>

        <div
          id="voteSummary"
          class="vote-summary"
        >
          <strong id="totalVotes">—</strong>
          <span>total votes</span>
        </div>
      </section>

      <section
        id="candidateGrid"
        class="candidate-grid"
        aria-live="polite"
      ></section>
    </section>

    <section
      id="mayorDataView"
      class="tracker-view hidden"
    >
      <section class="data-heading">
        <div>
          <p class="eyebrow">SAVED ELECTION DATA</p>
          <h2>Mayor Data</h2>
        </div>

        <p class="data-explanation">
          Latest perks recorded while each mayor was a candidate.
        </p>
      </section>

      <section
        id="mayorDataGrid"
        class="candidate-grid"
        aria-live="polite"
      ></section>
    </section>
  </main>

  <template id="leadershipTemplate">
    <article class="leader-card mayor-card">
      <div class="card-label">
        Current mayor
      </div>

      <h2 class="leader-name"></h2>
      <div class="perk-list"></div>
    </article>
  </template>

  <template id="candidateTemplate">
    <article class="candidate-card">
      <div class="candidate-topline">
        <div>
          <span class="rank"></span>
          <h3 class="candidate-name"></h3>
        </div>

        <div class="candidate-votes"></div>
      </div>

      <div
        class="vote-bar"
        aria-hidden="true"
      >
        <span></span>
      </div>

      <div class="candidate-perks"></div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
